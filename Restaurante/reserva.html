<h2>Hacer una Reserva en Nuestro Local</h2> <br> <br>

<input type="text" name="telefono" placeholder="Número de Teléfono" required class="RellenarFormulario"> <br> <br>
<input type="date" name="fecha" placeholder="Fecha de la Reserva" required class="RellenarFormulario">
<input type="time" name="hora" placeholder="Hora de la Reserva" required class="RellenarFormulario"> <br> <br>
<input type="text" name="comentarios" placeholder="Comentarios Adicionales" class="RellenarFormulario">  <br> <br> <br>
<input type="submit" value="Solicitar Reserva" class="EnvioFormulario"> <br> <br>
